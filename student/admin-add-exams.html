    // ==========================================
    // ADD EXAM FUNCTION
    // ==========================================

    async function addExam(examId, examData, questions) {

        // Create exam document
        await db.collection("exams")
            .doc(examId)
            .set(examData);


        // Create batch
        const batch = db.batch();


        // Add all questions
        questions.forEach((q) => {

            const questionRef = db
                .collection("exams")
                .doc(examId)
                .collection("questions")
                .doc();

            batch.set(questionRef, q);

        });


        // Save all questions together
        await batch.commit();
    }


    // ==========================================
    // BUTTON CLICK
    // ==========================================

    document
        .getElementById("addExamsBtn")
        .addEventListener("click", async function () {

            const button = this;
            const status = document.getElementById("status");


            button.disabled = true;
            button.innerText = "Adding Exams...";


            status.style.display = "block";
            status.className = "alert alert-info";
            status.innerText = "Please wait...";


            try {

                // ======================================
                // HTML EXAM
                // ======================================

                await addExam(

                    "html_exam_01",

                    {
                        title: "HTML Programming Exam",
                        description: "Basic HTML Programming",
                        duration: 30,
                        isActive: true,
                        status: "active",
                        subject: "HTML",
                        totalMarks: 10,
                        totalQuestions: 10
                    },

                    htmlQuestions
                );


                // ======================================
                // CSS EXAM
                // ======================================

                await addExam(

                    "css_exam_01",

                    {
                        title: "CSS Programming Exam",
                        description: "Basic CSS Programming",
                        duration: 30,
                        isActive: true,
                        status: "active",
                        subject: "CSS",
                        totalMarks: 10,
                        totalQuestions: 10
                    },

                    cssQuestions
                );
                


                // ======================================
                // SUCCESS
                // ======================================

                status.className = "alert alert-success";

                status.innerHTML = `
                    <strong>Success! 🎉</strong><br>
                    HTML Exam + 10 Questions added.<br>
                    CSS Exam + 10 Questions added.
                `;

                button.innerText = "Exams Added Successfully";


            } catch (error) {

                console.error(error);

                status.className = "alert alert-danger";

                status.innerHTML = `
                    <strong>Error!</strong><br>
                    ${error.message}
                `;

                button.disabled = false;
                button.innerText = "Try Again";

            }

        });
