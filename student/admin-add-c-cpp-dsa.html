// ==========================================
// ADD EXAM FUNCTION
// ==========================================

async function addExam(examId, examData, questions) {

    // Create exam document

    await db.collection("exams")
        .doc(examId)
        .set(examData);


    // Create batch

    const batch = db.batch();


    // Add questions

    questions.forEach((q) => {

        const questionRef = db
            .collection("exams")
            .doc(examId)
            .collection("questions")
            .doc();

        batch.set(questionRef, q);

    });


    // Save all questions

    await batch.commit();
}
