<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Exam Result</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background: #f5f7fb;
            min-height: 100vh;
        }

        .result-card {

            max-width: 750px;

            margin: 50px auto;

            background: white;

            border-radius: 20px;

            padding: 40px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.08);
        }

        .result-icon {

            font-size: 55px;

            margin-bottom: 10px;
        }

        .exam-title {

            font-weight: 700;

            margin-top: 20px;
        }

        .submitted-date {

            color: #777;

            font-size: 14px;

            margin-top: 5px;
        }

        .score-circle {

            width: 150px;

            height: 150px;

            border-radius: 50%;

            background: #eef2ff;

            display: flex;

            align-items: center;

            justify-content: center;

            margin: 30px auto;
        }

        .score-circle h1 {

            margin: 0;

            font-size: 48px;

            font-weight: 700;

            color: #5638d5;
        }

        .score-label {

            color: #777;

            font-size: 14px;
        }

        .score-text {

            font-size: 22px;

            margin-bottom: 30px;
        }

        .stat-card {

            border-radius: 15px;

            padding: 22px;

            text-align: center;

            background: #f8f9fc;

            height: 100%;
        }

        .stat-card h3 {

            margin: 0;

            font-size: 32px;

            font-weight: 700;
        }

        .correct {

            color: #00c9a7;
        }

        .wrong {

            color: #ff416c;
        }

        .total {

            color: #4361ee;
        }

        .btn-dashboard {

            margin-top: 30px;

            padding: 12px 25px;

            border-radius: 10px;
        }

    </style>

</head>


<body>


<div class="container">

    <div class="result-card text-center">


        <!-- ICON -->

        <div class="result-icon">

            🎉

        </div>


        <!-- TITLE -->

        <h2 class="fw-bold">

            Exam Completed!

        </h2>


        <p class="text-muted">

            Your examination has been submitted successfully.

        </p>


        <!-- EXAM TITLE -->

        <h3
            id="examTitle"
            class="exam-title">

            Loading...

        </h3>


        <!-- DATE -->

        <p
            id="submittedDate"
            class="submitted-date">

        </p>


        <!-- PERCENTAGE -->

        <div class="score-circle">

            <div>

                <h1 id="percentage">

                    0%

                </h1>

                <div class="score-label">

                    Score

                </div>

            </div>

        </div>


        <!-- SCORE -->

        <div class="score-text">

            Score:

            <strong>

                <span id="score">

                    0

                </span>

                /

                <span id="totalMarks">

                    0

                </span>

            </strong>

        </div>


        <!-- STAT CARDS -->

        <div class="row g-3">


            <!-- CORRECT -->

            <div class="col-md-4">

                <div class="stat-card">

                    <h3
                        id="correctAnswers"
                        class="correct">

                        0

                    </h3>

                    <p class="mb-0">

                        Correct

                    </p>

                </div>

            </div>


            <!-- WRONG -->

            <div class="col-md-4">

                <div class="stat-card">

                    <h3
                        id="wrongAnswers"
                        class="wrong">

                        0

                    </h3>

                    <p class="mb-0">

                        Wrong

                    </p>

                </div>

            </div>


            <!-- TOTAL -->

            <div class="col-md-4">

                <div class="stat-card">

                    <h3
                        id="totalQuestions"
                        class="total">

                        0

                    </h3>

                    <p class="mb-0">

                        Total

                    </p>

                </div>

            </div>


        </div>


        <!-- DASHBOARD -->

        <div>

            <a
                href="dashboard.html"
                class="btn btn-primary btn-dashboard">

                🏠 Dashboard

            </a>

        </div>


    </div>

</div>


<!-- FIREBASE -->

<script
    src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
</script>

<script
    src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
</script>

<script
    src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
</script>


<!-- YOUR JS -->

<script src="../js/firebase-config.js"></script>

<script src="../js/utils.js"></script>

<script src="../js/result.js"></script>


</body>

</html>
