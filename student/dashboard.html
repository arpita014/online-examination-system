<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard - Online Examination System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <link href="../css/dashboard.css" rel="stylesheet">
  <link href="../css/responsive.css" rel="stylesheet">
</head>
<body>
  <div id="globalLoader" class="d-none">
    <div class="spinner-border text-primary" role="status"></div>
  </div>
  <div id="toastContainer"></div>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <h4><i class="fas fa-graduation-cap me-2"></i>Exam System</h4>
      <small>Student Portal</small>
    </div>
    <div class="sidebar-nav">
      <a href="dashboard.html" class="nav-link active" data-page="dashboard">
        <i class="fas fa-home"></i> Dashboard
      </a>
      <a href="history.html" class="nav-link" data-page="history">
        <i class="fas fa-history"></i> Exam History
      </a>
      <a href="#" class="nav-link" id="logoutBtn">
        <i class="fas fa-sign-out-alt"></i> Logout
      </a>
    </div>
  </nav>

  <main class="main-content">
    <div class="top-bar">
      <div>
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <h4 class="page-title d-inline ms-2">Dashboard</h4>
      </div>
      <div class="user-info">
        <div class="text-end">
          <div id="userName" class="fw-bold">Student</div>
          <small class="text-muted" id="userCourse">Course</small>
        </div>
        <div class="user-avatar" id="userAvatar">S</div>
      </div>
    </div>

    <div class="welcome-banner">
      <h3>Welcome, <span id="welcomeName">Student</span>!</h3>
      <p>Ready to take your next examination? Browse available exams below.</p>
    </div>

    <div class="dashboard-grid">
      <div class="card stat-card">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="stat-icon bg-primary bg-opacity-10 text-primary"><i class="fas fa-clipboard-list"></i></div>
          <div>
            <div class="stat-value" id="availableExamsCount">0</div>
            <div class="stat-label">Available Exams</div>
          </div>
        </div>
      </div>
      <div class="card stat-card success">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="stat-icon bg-success bg-opacity-10 text-success"><i class="fas fa-check-circle"></i></div>
          <div>
            <div class="stat-value" id="completedExamsCount">0</div>
            <div class="stat-label">Completed</div>
          </div>
        </div>
      </div>
      <div class="card stat-card info">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="stat-icon bg-info bg-opacity-10 text-info"><i class="fas fa-redo"></i></div>
          <div>
            <div class="stat-value" id="totalAttemptsCount">0</div>
            <div class="stat-label">Total Attempts</div>
          </div>
        </div>
      </div>
      <div class="card stat-card warning">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="stat-icon bg-warning bg-opacity-10 text-warning"><i class="fas fa-chart-line"></i></div>
          <div>
            <div class="stat-value" id="avgScoreCount">0%</div>
            <div class="stat-label">Average Score</div>
          </div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-lg-8">
        <h5 class="mb-3"><i class="fas fa-clipboard-list me-2"></i>Available Exams</h5>
        <div class="row" id="availableExamsList"></div>
      </div>
      <div class="col-lg-4">
        <div class="card">
          <div class="card-header bg-white">
            <h6 class="mb-0"><i class="fas fa-clock me-2"></i>Recent Results</h6>
          </div>
          <div class="card-body recent-activity" id="recentResultsList"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/student-dashboard.js"></script>
  <script>
    document.getElementById('sidebarToggle')?.addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('show');
      document.getElementById('sidebarOverlay').classList.toggle('show');
    });
    document.getElementById('sidebarOverlay')?.addEventListener('click', () => {
      document.getElementById('sidebar').classList.remove('show');
      document.getElementById('sidebarOverlay').classList.remove('show');
    });
  </script>
</body>
</html>
