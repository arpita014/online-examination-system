<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam History - Online Examination System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <link href="../css/dashboard.css" rel="stylesheet">
  <link href="../css/responsive.css" rel="stylesheet">
</head>
<body>
  <div id="globalLoader" class="d-none">
    <div class="spinner-border text-primary" role="status"></div>
  </div>
  <div id="toastContainer"></div>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <h4><i class="fas fa-graduation-cap me-2"></i>Exam System</h4>
      <small>Student Portal</small>
    </div>
    <div class="sidebar-nav">
      <a href="dashboard.html" class="nav-link" data-page="dashboard">
        <i class="fas fa-home"></i> Dashboard
      </a>
      <a href="history.html" class="nav-link active" data-page="history">
        <i class="fas fa-history"></i> Exam History
      </a>
      <a href="#" class="nav-link" id="logoutBtn">
        <i class="fas fa-sign-out-alt"></i> Logout
      </a>
    </div>
  </nav>

  <main class="main-content">
    <div class="top-bar">
      <div>
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <h4 class="page-title d-inline ms-2">Exam History</h4>
      </div>
      <div class="user-info">
        <div class="text-end">
          <div id="userName" class="fw-bold">Student</div>
        </div>
        <div class="user-avatar" id="userAvatar">S</div>
      </div>
    </div>

    <div class="chart-card mb-4">
      <h5><i class="fas fa-chart-line me-2"></i>Performance Trend</h5>
      <div class="chart-container">
        <canvas id="historyChart"></canvas>
      </div>
    </div>

    <div class="table-container">
      <table class="table table-hover">
        <thead>
          <tr>
            <th>Exam</th>
            <th>Score</th>
            <th>Percentage</th>
            <th>Correct/Wrong</th>
            <th>Date</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="historyTableBody"></tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/history.js"></script>
  <script>
    document.getElementById('sidebarToggle')?.addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('show');
      document.getElementById('sidebarOverlay').classList.toggle('show');
    });
    document.getElementById('sidebarOverlay')?.addEventListener('click', () => {
      document.getElementById('sidebar').classList.remove('show');
      document.getElementById('sidebarOverlay').classList.remove('show');
    });
  </script>
</body>
</html>
