<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Examination System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/auth.css" rel="stylesheet">
</head>
<body class="auth-page">
  <div class="auth-container text-center">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon"><i class="fas fa-graduation-cap"></i></div>
        <h2>Online Examination System</h2>
        <p>Cloud-Based Assessment Platform</p>
      </div>
      <div class="auth-body">
        <p class="text-muted mb-4">Secure, reliable, and efficient online examinations powered by Firebase.</p>
        <a href="login.html" class="btn btn-primary btn-lg w-100 mb-3">
          <i class="fas fa-sign-in-alt me-2"></i>Login
        </a>
        <a href="register.html" class="btn btn-outline-primary btn-lg w-100">
          <i class="fas fa-user-plus me-2"></i>Register
        </a>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
