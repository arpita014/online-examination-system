
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - Online Examination System</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    rel="stylesheet"
  >

  <link href="css/style.css" rel="stylesheet">
  <link href="css/auth.css" rel="stylesheet">

  <style>
    .forgot-password {
      text-align: right;
      margin: 10px 0 20px;
    }

    .forgot-password a {
      color: #5145f5;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .forgot-password a:hover {
      text-decoration: underline;
    }

    #resetMessage {
      display: none;
      margin-bottom: 15px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body class="auth-page">

  <div id="globalLoader" class="d-none">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div id="toastContainer"></div>

  <div class="auth-container">
    <div class="auth-card">

      <div class="auth-header">
        <div class="auth-icon">
          <i class="fas fa-sign-in-alt"></i>
        </div>

        <h2>Welcome Back</h2>
        <p>Login to your account</p>
      </div>

      <div class="auth-body">

        <div
          id="resetMessage"
          class="alert"
          role="alert"
          aria-live="polite"
        ></div>

        <form id="loginForm">

          <div class="mb-3">
            <label for="email" class="form-label">
              Email Address
            </label>

            <div class="input-group">
              <span class="input-group-text">
                <i class="fas fa-envelope"></i>
              </span>

              <input
                type="email"
                class="form-control"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
              >
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">
              Password
            </label>

            <div class="input-group">
              <span class="input-group-text">
                <i class="fas fa-lock"></i>
              </span>

              <input
                type="password"
                class="form-control"
                id="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              >
            </div>
          </div>

          <div class="forgot-password">
            <a href="#" id="forgotPasswordLink">
              Forgot Password?
            </a>
          </div>

          <button type="submit" class="btn btn-primary">
            <i class="fas fa-sign-in-alt me-2"></i>
            Login
          </button>

        </form>
      </div>

      <div class="auth-footer">
        Don't have an account?
        <a href="register.html">Register here</a>
      </div>

    </div>
  </div>

  <!-- Required libraries -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- Existing project scripts -->
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>

  <!-- Forgot Password functionality -->
  <script>
    const forgotPasswordLink =
      document.getElementById("forgotPasswordLink");

    const emailInput = document.getElementById("email");
    const resetMessage = document.getElementById("resetMessage");

    forgotPasswordLink.addEventListener("click", async function (event) {
      event.preventDefault();

      resetMessage.style.display = "none";
      resetMessage.textContent = "";
      resetMessage.className = "alert";

      const email = emailInput.value.trim();

      if (!email) {
        emailInput.focus();
        emailInput.reportValidity();

        showResetMessage(
          "Please enter your email address first.",
          "danger"
        );
        return;
      }

      if (!emailInput.checkValidity()) {
        showResetMessage(
          "Please enter a valid email address.",
          "danger"
        );
        emailInput.focus();
        return;
      }

      forgotPasswordLink.style.pointerEvents = "none";
      forgotPasswordLink.style.opacity = "0.6";

      try {
        if (typeof firebase === "undefined" ||
            !firebase.apps.length) {
          throw new Error(
            "Firebase is not initialized. Check js/firebase-config.js."
          );
        }

        const auth = firebase.auth();

        await auth.sendPasswordResetEmail(email);

        showResetMessage(
          "If an account exists for this email, a password reset email may arrive shortly. Check your inbox and Spam folder.",
          "success"
        );

      
      } catch (error) {
        let message =
          "Unable to process the password reset request. Please try again.";

        switch (error.code) {
          case "auth/invalid-email":
            message = "Please enter a valid email address.";
            break;

          case "auth/too-many-requests":
            message =
              "Too many attempts. Please wait a while and try again.";
            break;

          case "auth/network-request-failed":
            message =
              "Network error. Please check your internet connection.";
            break;

          case "auth/operation-not-allowed":
            message =
              "Email/Password sign-in must be enabled in Firebase Authentication.";
            break;

          case "auth/invalid-api-key":
            message =
              "Firebase API key is invalid. Check js/firebase-config.js.";
            break;
        }

        showResetMessage(message, "danger");

      } finally {
        forgotPasswordLink.style.pointerEvents = "auto";
        forgotPasswordLink.style.opacity = "1";
      }
    }
    );
  

    function showResetMessage(message, type) {
      resetMessage.textContent = message;
      resetMessage.className = "alert alert-" + type;
      resetMessage.style.display = "block";
    }
  </script>

</body>
</html>
