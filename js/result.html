<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exam Result - Online Examination System</title>


    <!-- ================= BOOTSTRAP ================= -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- ================= FONT AWESOME ================= -->

    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        rel="stylesheet">


    <!-- ================= MAIN CSS ================= -->

    <link
        href="../css/style.css"
        rel="stylesheet">


    <style>

        body {
            background: #f5f7fb;
            min-height: 100vh;
            padding: 30px 0;
        }


        .result-card {
            max-width: 800px;
            margin: 30px auto;
            background: #ffffff;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }


        .success-icon {
            font-size: 55px;
            margin-bottom: 10px;
        }


        .result-heading {
            font-weight: 700;
            margin-bottom: 8px;
        }


        .exam-title {
            font-size: 24px;
            font-weight: 600;
            margin-top: 25px;
        }


        .submitted-date {
            color: #6c757d;
            margin-top: 8px;
            font-size: 15px;
        }


        .score-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: #eef2ff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px auto;
        }


        .score-circle h1 {
            margin: 0;
            font-weight: 700;
            font-size: 42px;
            color: #4f36d9;
        }


        .score-label {
            color: #6c757d;
            font-size: 14px;
        }


        .score-text {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 30px;
        }


        .stat-card {
            border-radius: 15px;
            padding: 22px;
            text-align: center;
            background: #f8f9fa;
            height: 100%;
        }


        .stat-card h3 {
            margin: 0;
            font-weight: 700;
            font-size: 32px;
        }


        .stat-card p {
            margin-top: 8px;
            margin-bottom: 0;
            font-weight: 500;
        }


        .correct-number {
            color: #198754;
        }


        .wrong-number {
            color: #dc3545;
        }


        .total-number {
            color: #0d6efd;
        }


        .action-buttons {
            margin-top: 40px;
        }


        .action-buttons .btn {
            margin: 5px;
        }


        /* CERTIFICATE BUTTON */

        #certificateBtn {
            background-color: #198754 !important;
            border-color: #198754 !important;
            color: white !important;
            font-weight: 600;
            padding: 10px 20px;
        }


        #certificateBtn:hover {
            background-color: #146c43 !important;
            border-color: #146c43 !important;
        }


        /* CERTIFICATE MESSAGE */

        #certificateMessage {
            margin-top: 15px;
            font-size: 14px;
        }


        @media (max-width: 576px) {

            .result-card {
                margin: 15px;
                padding: 25px 18px;
            }


            .score-circle {
                width: 140px;
                height: 140px;
            }


            .score-circle h1 {
                font-size: 36px;
            }


            .exam-title {
                font-size: 20px;
            }


            .action-buttons .btn {
                display: block;
                width: 100%;
                margin: 8px 0;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <div class="result-card text-center">


        <!-- ================= SUCCESS ICON ================= -->

        <div class="success-icon">
            🎉
        </div>


        <!-- ================= HEADING ================= -->

        <h2 class="result-heading">
            Exam Completed!
        </h2>


        <p class="text-muted">
            Your examination has been submitted successfully.
        </p>


        <!-- ================= EXAM TITLE ================= -->

        <h3
            id="examTitle"
            class="exam-title">

            Loading...

        </h3>


        <!-- ================= SUBMITTED DATE ================= -->

        <p
            id="submittedDate"
            class="submitted-date">

            Loading submission date...

        </p>


        <!-- ================= PERCENTAGE ================= -->

        <div class="score-circle">

            <div>

                <h1 id="percentage">
                    0%
                </h1>

                <div class="score-label">
                    Percentage
                </div>

            </div>

        </div>


        <!-- ================= SCORE ================= -->

        <div class="score-text">

            Score:

            <span id="score">
                0
            </span>

            /

            <span id="totalMarks">
                0
            </span>

        </div>


        <!-- ================= STATISTICS ================= -->

        <div class="row g-3">


            <!-- CORRECT -->

            <div class="col-md-4">

                <div class="stat-card">

                    <h3
                        id="correctAnswers"
                        class="correct-number">

                        0

                    </h3>

                    <p class="text-success">
                        Correct
                    </p>

                </div>

            </div>


            <!-- WRONG -->

            <div class="col-md-4">

                <div class="stat-card">

                    <h3
                        id="wrongAnswers"
                        class="wrong-number">

                        0

                    </h3>

                    <p class="text-danger">
                        Wrong
                    </p>

                </div>

            </div>


            <!-- TOTAL -->

            <div class="col-md-4">

                <div class="stat-card">

                    <h3
                        id="totalQuestions"
                        class="total-number">

                        0

                    </h3>

                    <p class="text-primary">
                        Total Questions
                    </p>

                </div>

            </div>

        </div>


        <!-- ================================================= -->
        <!-- ACTION BUTTONS -->
        <!-- ================================================= -->

        <div class="action-buttons text-center">


            <!-- ================= CERTIFICATE ================= -->

            <button
                type="button"
                id="certificateBtn"
                class="btn btn-success"
                style="display: none;"
                onclick="openCertificate()">

                <i class="fas fa-certificate me-1"></i>

                View Certificate

            </button>


            <!-- ================= DASHBOARD ================= -->

            <a
                href="dashboard.html"
                class="btn btn-primary">

                <i class="fas fa-home me-1"></i>

                Dashboard

            </a>


            <!-- ================= REFRESH ================= -->

            <button
                type="button"
                class="btn btn-outline-secondary"
                onclick="window.location.reload()">

                <i class="fas fa-sync-alt me-1"></i>

                Refresh

            </button>


            <!-- ================= CERTIFICATE MESSAGE ================= -->

            <div id="certificateMessage"></div>


        </div>


    </div>

</div>



<!-- ================= BOOTSTRAP JS ================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>



<!-- ================= FIREBASE ================= -->

<script
    src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js">
</script>


<script
    src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js">
</script>


<script
    src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js">
</script>



<!-- ================= FIREBASE CONFIG ================= -->

<script src="../js/firebase-config.js?v=certificate3"></script>



<!-- ================= UTILS ================= -->

<script src="../js/utils.js?v=certificate3"></script>



<!-- ================= RESULT JS ================= -->

<script src="../js/result.js?v=certificate3"></script>



<!-- ================================================= -->
<!-- CERTIFICATE LOGIC -->
<!-- ================================================= -->

<script>

document.addEventListener("DOMContentLoaded", function () {

    console.log("================================");
    console.log("CERTIFICATE CHECK STARTED");
    console.log("================================");


    const params =
        new URLSearchParams(window.location.search);


    const resultId =
        params.get("resultId");


    console.log("RESULT ID:", resultId);


    if (!resultId) {

        console.error("Result ID not found.");

        return;

    }


    checkCertificateEligibility(resultId);

});



async function checkCertificateEligibility(resultId) {

    try {

        console.log("Checking certificate eligibility...");


        const resultRef =
            db.collection("results").doc(resultId);


        const resultSnap =
            await resultRef.get();


        console.log(
            "RESULT EXISTS:",
            resultSnap.exists
        );


        if (!resultSnap.exists) {

            console.error("Result document not found.");

            return;

        }


        const result =
            resultSnap.data();


        console.log(
            "RESULT DATA:",
            result
        );


        const percentage =
            Number(result.percentage || 0);


        console.log(
            "PERCENTAGE:",
            percentage
        );


        const certificateBtn =
            document.getElementById("certificateBtn");


        const certificateMessage =
            document.getElementById("certificateMessage");


        if (!certificateBtn) {

            console.error(
                "Certificate button not found!"
            );

            return;

        }


        /*
         * ==========================================
         * CERTIFICATE ELIGIBILITY
         * ==========================================
         *
         * 50% or above = Certificate available
         * Below 50% = Certificate unavailable
         *
         */


        if (percentage >= 50) {


            certificateBtn.style.display =
                "inline-block";


            certificateMessage.innerHTML =

                '<span class="text-success">' +
                '<i class="fas fa-check-circle"></i> ' +
                'You are eligible for a certificate.' +
                '</span>';


            console.log(
                "CERTIFICATE: AVAILABLE"
            );


        }

        else {


            certificateBtn.style.display =
                "none";


            certificateMessage.innerHTML =

                '<span class="text-muted">' +
                'Certificate is available for students scoring 50% or above.' +
                '</span>';


            console.log(
                "CERTIFICATE: NOT AVAILABLE"
            );

        }


    }

    catch (error) {


        console.error(
            "CERTIFICATE CHECK ERROR:",
            error
        );


    }

}



/* ================================================= */
/* OPEN CERTIFICATE */
/* ================================================= */



function openCertificate() {

    const params =
        new URLSearchParams(window.location.search);

    const resultId =
        params.get("resultId");

    console.log("Certificate Result ID:", resultId);

    if (!resultId) {

        alert("Result ID not found!");

        return;
    }

    window.location.href =
        "certificate.html?resultId=" +
        encodeURIComponent(resultId);
}


</script>



</body>

</html>
