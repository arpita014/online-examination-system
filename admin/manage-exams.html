<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Exams - Online Examination System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <link href="../css/dashboard.css" rel="stylesheet">
  <link href="../css/responsive.css" rel="stylesheet">
</head>
<body>
  <div id="globalLoader" class="d-none">
    <div class="spinner-border text-primary" role="status"></div>
  </div>
  <div id="toastContainer"></div>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <h4><i class="fas fa-shield-alt me-2"></i>Admin Panel</h4>
      <small>Examination System</small>
    </div>
    <div class="sidebar-nav">
      <a href="dashboard.html" class="nav-link" data-page="dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
      <a href="manage-exams.html" class="nav-link active" data-page="manage-exams"><i class="fas fa-clipboard-list"></i> Manage Exams</a>
      <a href="manage-questions.html" class="nav-link" data-page="manage-questions"><i class="fas fa-question-circle"></i> Manage Questions</a>
      <a href="manage-students.html" class="nav-link" data-page="manage-students"><i class="fas fa-users"></i> Manage Students</a>
      <a href="manage-results.html" class="nav-link" data-page="manage-results"><i class="fas fa-chart-bar"></i> Manage Results</a>
      <a href="#" class="nav-link" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
  </nav>

  <main class="main-content">
    <div class="top-bar">
      <div>
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <h4 class="page-title d-inline ms-2">Manage Exams</h4>
      </div>
      <div class="user-info">
        <div id="adminName" class="fw-bold">Admin</div>
      </div>
    </div>

    <div class="d-flex justify-content-end mb-3">
      <button class="btn btn-primary" onclick="openCreateModal()">
        <i class="fas fa-plus me-1"></i> Create Exam
      </button>
    </div>

    <div class="table-container">
      <table class="table table-hover">
        <thead>
          <tr>
            <th>Title</th>
            <th>Duration</th>
            <th>Questions</th>
            <th>Marks</th>
            <th>Status</th>
            <th>Created</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="examsTableBody"></tbody>
      </table>
    </div>
  </main>

  <div class="modal fade" id="examModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="examModalTitle">Create Exam</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="examForm">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Title</label>
              <input type="text" class="form-control" id="examTitle" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea class="form-control" id="examDescription" rows="3"></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Duration (minutes)</label>
              <input type="number" class="form-control" id="examDuration" min="1" value="60" required>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="examActive" checked>
              <label class="form-check-label" for="examActive">Active</label>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/exam-management.js"></script>
  <script>
    document.getElementById('sidebarToggle')?.addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('show');
      document.getElementById('sidebarOverlay').classList.toggle('show');
    });
    document.getElementById('sidebarOverlay')?.addEventListener('click', () => {
      document.getElementById('sidebar').classList.remove('show');
      document.getElementById('sidebarOverlay').classList.remove('show');
    });
  </script>
</body>
</html>
