<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Results - Online Examination System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
  <link href="../css/dashboard.css" rel="stylesheet">
  <link href="../css/responsive.css" rel="stylesheet">
</head>
<body>
  <div id="globalLoader" class="d-none">
    <div class="spinner-border text-primary" role="status"></div>
  </div>
  <div id="toastContainer"></div>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <nav class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <h4><i class="fas fa-shield-alt me-2"></i>Admin Panel</h4>
      <small>Examination System</small>
    </div>
    <div class="sidebar-nav">
      <a href="dashboard.html" class="nav-link" data-page="dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
      <a href="manage-exams.html" class="nav-link" data-page="manage-exams"><i class="fas fa-clipboard-list"></i> Manage Exams</a>
      <a href="manage-questions.html" class="nav-link" data-page="manage-questions"><i class="fas fa-question-circle"></i> Manage Questions</a>
      <a href="manage-students.html" class="nav-link" data-page="manage-students"><i class="fas fa-users"></i> Manage Students</a>
      <a href="manage-results.html" class="nav-link active" data-page="manage-results"><i class="fas fa-chart-bar"></i> Manage Results</a>
      <a href="#" class="nav-link" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
  </nav>

  <main class="main-content">
    <div class="top-bar">
      <div>
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <h4 class="page-title d-inline ms-2">Manage Results</h4>
      </div>
      <div class="user-info">
        <div id="adminName" class="fw-bold">Admin</div>
      </div>
    </div>

    <div class="row mb-4">
      <div class="col-lg-6 mb-3">
        <div class="chart-card">
          <h5><i class="fas fa-chart-bar me-2"></i>Average Performance by Exam</h5>
          <div class="chart-container">
            <canvas id="performanceChart"></canvas>
          </div>
        </div>
      </div>
      <div class="col-lg-6 mb-3">
        <div class="chart-card">
          <h5><i class="fas fa-chart-pie me-2"></i>Pass / Fail Ratio</h5>
          <div class="chart-container">
            <canvas id="passFailChart"></canvas>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex gap-2 mb-3 flex-wrap">
      <select class="form-select w-auto" id="resultFilter">
        <option value="">All Exams</option>
      </select>
      <div class="search-box flex-grow-1">
        <i class="fas fa-search"></i>
        <input type="text" class="form-control" id="resultSearch" placeholder="Search by student or exam...">
      </div>
    </div>

    <div class="table-container">
      <table class="table table-hover">
        <thead>
          <tr>
            <th>#</th>
            <th>Student</th>
            <th>Exam</th>
            <th>Score</th>
            <th>Percentage</th>
            <th>Correct/Total</th>
            <th>Submitted</th>
          </tr>
        </thead>
        <tbody id="resultsTableBody"></tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/result-management.js"></script>
  <script>
    document.getElementById('sidebarToggle')?.addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('show');
      document.getElementById('sidebarOverlay').classList.toggle('show');
    });
    document.getElementById('sidebarOverlay')?.addEventListener('click', () => {
      document.getElementById('sidebar').classList.remove('show');
      document.getElementById('sidebarOverlay').classList.remove('show');
    });
  </script>
</body>
</html>
